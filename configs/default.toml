# Octra daemon configuration.
# Copied to $OCTRA_HOME/config.toml on first start.
# Environment overrides: OCTRA_CONTROL_BIND, OCTRA_GATEWAY_BIND,
# OCTRA_LOG_LEVEL, OCTRA_LOG_FORMAT.

[daemon]
control_bind = "127.0.0.1:8081"

# Unified data plane for the API, LLM, and MCP gateways.
[gateway]
listen_bind = "127.0.0.1:8080"
request_timeout_secs = 60
connect_timeout_secs = 10
max_body_bytes = 33554432

[llm]
request_timeout_secs = 120
stream_idle_timeout_secs = 120
# Optional OpenAI-compatible embedding endpoint for semantic routing.
# [llm.semantic_embedding]
# base_url = "http://127.0.0.1:11434/v1"
# model = "nomic-embed-text"
# timeout_ms = 1500
# cache_entries = 1024

[mcp]
request_timeout_secs = 60
tool_call_timeout_secs = 120

[storage]
path = "octra.db"

[storage.retention]
# Days: 0 keeps rows forever. llm_usage_days must be 0 or >= 32 so a
# monthly virtual key limit still sees a full window.
enabled = true
llm_usage_days = 90
request_logs_days = 30
mcp_invocations_days = 90
audit_logs_days = 365
usage_rollup_days = 400
# Completed and failed plugin events; pending events are never pruned.
plugin_events_days = 7
interval_secs = 3600
batch_size = 5000

[logging]
level = "info"
format = "pretty"

# Optional OTLP/HTTP JSON metrics export. Disabled by default.
# interval_secs must be between 5 and 3600.
# [telemetry]
# enabled = false
# interval_secs = 30
# service_name = "octra"
#
# [telemetry.otlp]
# endpoint = "http://127.0.0.1:4318"
# headers = {}
