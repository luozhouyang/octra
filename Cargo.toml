[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Octra contributors"]
repository = "https://github.com/luozhouyang/octra"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
mime = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
once_cell = "1"
ort = "=2.0.0-rc.10"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "stream",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokenizers = "0.21.4"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

octra-api-core = { path = "crates/octra-api-core" }
octra-api-gateway = { path = "crates/octra-api-gateway" }
octra-config = { path = "crates/octra-config" }
octra-core = { path = "crates/octra-core" }
octra-data-plane = { path = "crates/octra-data-plane" }
octra-types = { path = "crates/octra-types" }
octra-runtime = { path = "crates/octra-runtime" }
octra-llm-core = { path = "crates/octra-llm-core" }
octra-pii-types = { path = "crates/octra-pii-types" }
octra-llm-gateway = { path = "crates/octra-llm-gateway" }
octra-llm-plugin-types = { path = "crates/octra-llm-plugin-types" }
octra-llm-plugin-builtin = { path = "crates/octra-llm-plugin-builtin" }
octra-llm-plugin-runtime = { path = "crates/octra-llm-plugin-runtime" }
octra-llm-protocol = { path = "crates/octra-llm-protocol" }
octra-mcp-core = { path = "crates/octra-mcp-core" }
octra-mcp-gateway = { path = "crates/octra-mcp-gateway" }
octra-observability = { path = "crates/octra-observability" }
octra-api-plugin-types = { path = "crates/octra-api-plugin-types" }
octra-api-plugin-builtin = { path = "crates/octra-api-plugin-builtin" }
octra-api-plugin-runtime = { path = "crates/octra-api-plugin-runtime" }
octra-api-plugin-wasm = { path = "crates/octra-api-plugin-wasm" }
octra-plugin-storage = { path = "crates/octra-plugin-storage" }
octra-storage = { path = "crates/octra-storage" }
