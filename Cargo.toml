[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Octra contributors"]
repository = "https://github.com/luozhouyang/octra"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

octra-config = { path = "crates/octra-config" }
octra-core = { path = "crates/octra-core" }
octra-gateway-api = { path = "crates/octra-gateway-api" }
octra-gateway-runtime = { path = "crates/octra-gateway-runtime" }
octra-observability = { path = "crates/octra-observability" }
octra-storage = { path = "crates/octra-storage" }
