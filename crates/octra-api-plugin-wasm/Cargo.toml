[package]
name = "octra-api-plugin-wasm"
description = "WASM component runtime for third-party Octra API Gateway plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
http.workspace = true
octra-api-core.workspace = true
octra-api-plugin-runtime.workspace = true
octra-api-plugin-types.workspace = true
octra-plugin-storage.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
wasmtime = { version = "50", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    "std",
] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"
