name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude octra-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude octra-desktop

  wasm:
    name: WASM plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target, examples/plugins/consumer-quota -> target"
      - name: Cache cargo-component
        id: cargo-component-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-component-0.21.1-${{ runner.os }}
      - name: Install cargo-component
        if: steps.cargo-component-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-component --locked --version 0.21.1
      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1
      - name: Build and run WASM plugin tests
        run: bash scripts/test-wasm.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
